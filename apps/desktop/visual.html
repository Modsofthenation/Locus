<!doctype html>
<html lang="en" data-theme="ember" data-visual>
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Locus visual harness</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' ws://127.0.0.1:* ws://localhost:* ws://[::1]:*; frame-src 'none'; media-src 'self'; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@320;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html[data-visual] *,
      html[data-visual] *::before,
      html[data-visual] *::after {
        animation: none !important;
        transition: none !important;
        caret-color: transparent !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/visual.tsx"></script>
  </body>
</html>
