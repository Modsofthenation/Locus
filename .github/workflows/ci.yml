name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22"
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/desktop
      - run: npm run test:visual
      - name: Upload visual diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 14
      # Run the remaining checks even when an earlier step failed, so a
      # screenshot or test failure cannot hide a lint/type/format/build break.
      - run: npm run typecheck
        if: ${{ !cancelled() }}
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npm run format:check
        if: ${{ !cancelled() }}
      - run: npm run build --workspace=@locus/desktop
        if: ${{ !cancelled() }}

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22"
      - name: Prefetch code-server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p images/agent/vendor
          node scripts/prefetch-github-release-asset.mjs --owner coder --repo code-server --tag v4.96.4 --file code-server-4.96.4-linux-amd64.tar.gz --out images/agent/vendor/code-server.tar.gz
      - run: docker build -t locus/agent:0.1 -t locus/agent:0.21.0 images/agent

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # v3 defaults to `tools platform-tools`; Google no longer serves `tools`.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
