name: Package Windows

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to package. Empty uses the triggering commit.
        type: string
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: package-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # github.com/releases/download 504s from Actions. Prefetch Electron (zip +
      # SHASUMS256.txt) and 7zip / NSIS / icons through the GitHub API so
      # @electron/get does not re-fetch checksums after the zip (that 504 is
      # what failed Windows after Linux/macOS already succeeded).
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: electron-cache
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            electron-${{ runner.os }}-
      - run: npm ci
      - name: Prefetch Electron and electron-builder binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prefetch-github-release-asset.mjs
      - name: Package
        env:
          RETRY_ATTEMPTS: "3"
          RETRY_DELAY_MS: "30000"
        run: node scripts/retry-cmd.mjs npm run dist --workspace=@locus/desktop
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: always()
        continue-on-error: true
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}
      - name: Checksums
        run: node scripts/release-checksums.mjs apps/desktop/dist-electron SHA256SUMS-windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: locus-windows-nsis
          path: |
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/SHA256SUMS-windows
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/SHA256SUMS-windows
          generate_release_notes: false
          body: ${{ github.ref == 'refs/tags/v0.4.1' && 'Windows desktop input hotfix. Linux and macOS installers remain 0.4.0; this tag ships the Windows NSIS build only.' || '' }}
