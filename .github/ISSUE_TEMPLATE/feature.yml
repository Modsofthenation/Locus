name: Feature request
description: Propose a change to Locus
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Locus do instead? Keep it local-first (loopback control plane, guests on this machine).
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agents / guest tools
        - Design
        - Codebase / git
        - Automations
        - Docker runtime
        - QEMU / VMs
        - Providers
        - Packaging / installers
        - Docs
        - Other
    validations:
      required: true
