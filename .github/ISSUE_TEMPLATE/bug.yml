name: Bug report
description: Something in Locus is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include provider keys, forge tokens, guest passwords, or `~/.locus/secrets.enc`.
        Guest escapes, token leaks, and unauthenticated control-plane access belong in a
        [private security advisory](https://github.com/Modsofthenation/Locus/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → About, or the GitHub Release tag (for example 0.19.0).
      placeholder: 0.19.0
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host OS
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Agent runtime
      options:
        - Host
        - Docker
        - QEMU VM
        - Mock (no Docker / QEMU)
        - Not sure / not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant control-plane or guest logs. Redact secrets.
      render: text
